name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # Compile errors are easy to lose in a long log. This pulls just the
      # "error:" lines into the run summary so they're the first thing visible.
      - name: Surface compile errors
        if: failure()
        working-directory: android
        run: |
          echo "### Compile errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gradle assembleDebug --no-daemon 2>&1 | grep -E "^e:|error:" | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taper-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
